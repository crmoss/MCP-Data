<main><section class="hero"><div class="hero-inner"><p class="eyebrow"><span></span> PUBLIC DATA EXPLORER</p><h1>필요한 데이터를,<br><em>더 쉽게 찾아보세요.</em></h1><p class="intro">공공데이터포털의 다양한 데이터를 한곳에서 검색하고<br class="desktop"> 업무와 분석에 필요한 정보를 확인하세요.</p><form id="search-form" class="search" role="search"><label class="sr-only" for="keyword">검색어</label><span class="search-icon" aria-hidden="true">⌕</span><input id="keyword" name="keyword" maxlength="200" placeholder="어떤 데이터가 필요하신가요?" autocomplete="off" required><button type="submit">검색하기 <span aria-hidden="true">↗</span></button></form><div class="suggestions"><span>추천 검색어</span><button data-keyword="교통">교통</button><button data-keyword="침수">침수</button><button data-keyword="인구">인구</button><button data-keyword="시설">시설</button></div></div><div class="hero-pattern" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div></section>
